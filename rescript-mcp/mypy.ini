[mypy]
python_version = 3.11
strict = True

# The Python parity driver imports from src/ms_access_mcp/ which is untyped.
# skip_imports would skip type-checking those imports but still report errors
# in our own code; follow_imports = skip avoids resolving them entirely which
# is what we want since we are only typing the scripts, not the product.
follow_imports = skip

# Allow untyped imports from third-party stubs we don't control.
# pyodbc is only used by inventory_fixture.py for probe-based schema discovery.
[mypy-pyodbc]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True
