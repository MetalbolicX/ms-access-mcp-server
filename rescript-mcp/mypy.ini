[mypy]
python_version = 3.11
strict = True

# Per plan 020: type-check our scripts strictly; tolerate untyped
# third-party libraries (no stubs exist on PyPI) and untyped product
# imports (out of scope to type here).

# Allow untyped third-party libraries (pyodbc, pytest) — they ship no
# stubs and types-pyodbc does not exist on PyPI. Our scripts only call
# runtime methods on these modules; we don't introspect their types.
ignore_missing_imports = True

# The Python parity driver imports from src/ms_access_mcp/ which is
# intentionally untyped product code (out of scope for plan 020).
# follow_imports = skip avoids resolving those imports entirely; we are
# only typing the scripts, not the product source.
follow_imports = skip
